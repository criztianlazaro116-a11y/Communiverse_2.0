<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CommuniVerse - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-blue: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-dark: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      --panel-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-family);
      background: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .split-card {
      background: var(--panel-bg);
      border-radius: 24px;
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }
    .brand-section {
      background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
      color: #ffffff;
      padding: 3rem 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .brand-content h2 {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 1rem;
    }
    .brand-content p {
      font-size: 0.9rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.85);
    }
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
      width: fit-content;
      margin-top: 1.5rem;
      backdrop-filter: blur(4px);
    }
    .brand-logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 1.5rem 0;
    }
    .brand-logo-container img {
      max-width: 160px;
      height: auto;
      object-fit: contain;
    }
    .form-section {
      padding: 3rem 2.5rem;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .auth-header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 0.25rem;
    }
    .auth-header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.75rem;
    }
    .form-group {
      margin-bottom: 1.15rem;
    }
    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrapper i {
      position: absolute;
      left: 1rem;
      color: var(--text-muted);
      font-size: 0.9rem;
      z-index: 2;
    }
    .form-control {
      width: 100%;
      background: #f8fafc;
      border: 1px solid var(--border-color);
      padding: 0.75rem 1rem 0.75rem 2.6rem;
      border-radius: 12px;
      color: var(--text-main);
      font-family: var(--font-family);
      font-size: 0.875rem;
      transition: all 0.2s ease;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary-blue);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    .btn-submit {
      width: 100%;
      background: var(--primary-blue);
      color: #fff;
      border: none;
      padding: 0.85rem;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 0.75rem;
      transition: background 0.2s ease;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
    .btn-submit:hover {
      background: var(--primary-hover);
    }
    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .btn-home {
      width: 100%;
      background: #f1f5f9;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.75rem;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-home:hover {
      background: #e2e8f0;
      color: var(--primary-blue);
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .register-links {
      display: flex;
      justify-content: space-around;
      margin-top: 1.25rem;
      font-size: 0.8rem;
    }
    .register-links a {
      color: var(--primary-blue);
      font-weight: 700;
      text-decoration: none;
    }
    .register-links a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .split-card {
        grid-template-columns: 1fr;
        max-width: 480px;
      }
      .brand-section { padding: 2rem; }
      .brand-content h2 { font-size: 1.5rem; }
      .form-section { padding: 2rem; }
    }
  </style>
</head>
<body>

  <div class="split-card">
    <div class="brand-section">
      <div class="brand-content">
        <div class="brand-badge"><i class="fa-solid fa-globe"></i> Welcome Back</div>
        <h2>Sign in to CommuniVerse</h2>
        <p>Access your dashboard to connect, track missions, and manage your academic profile seamlessly.</p>
      </div>
      <div class="brand-logo-container">
        <img src="logo.png" alt="CommuniVerse Logo">
      </div>
      <div style="font-size: 0.75rem; color: rgba(255, 255, 255, 0.7);">
        © CommuniVerse Platform. All rights reserved.
      </div>
    </div>

    <div class="form-section">
      <div class="auth-header">
        <h1>Account Login</h1>
        <p>Enter your credentials to continue.</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="loginEmail" class="form-control" placeholder="your.email@gmail.com" required>
          </div>
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
          </div>
        </div>
        <button type="submit" id="submitBtn" class="btn-submit">Sign In</button>
        <a href="index.html" class="btn-home"><i class="fa-solid fa-house"></i> Go Home</a>
      </form>

      <div class="register-links">
        <a href="student-register.html"><i class="fa-solid fa-user-plus"></i> Student Register</a>
        <a href="teacher-register.html"><i class="fa-solid fa-chalkboard-user"></i> Teacher Register</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCG8iQlK2LeiwUkmfzF4I-_20DnRW-33jk",
      authDomain: "pnhs-election-portal.firebaseapp.com",
      databaseURL: "https://pnhs-election-portal-default-rtdb.firebaseio.com",
      projectId: "pnhs-election-portal",
      storageBucket: "pnhs-election-portal.firebasestorage.app",
      messagingSenderId: "290654124306",
      appId: "1:290654124306:web:427f64ef9de55695a75bcb"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      submitBtn.disabled = true;
      submitBtn.textContent = "Signing In...";

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        const userRef = ref(db, `registeredUsers/${user.uid}`);
        const snapshot = await get(userRef);

        if (snapshot.exists()) {
          const userData = snapshot.val();
          const role = userData.role;

          // Save user state locally to keep sessions synchronized with dashboards
          localStorage.setItem('currentUser', JSON.stringify({
            uid: user.uid,
            role: role,
            email: user.email,
            ...userData
          }));

          if (role === 'teacher') {
            window.location.href = "teacher-dashboard.html";
          } else if (role === 'student') {
            window.location.href = "student-dashboard.html";
          } else {
            window.location.href = "dashboard.html";
          }
        } else {
          alert("User record not found in the database. Please contact support.");
          submitBtn.disabled = false;
          submitBtn.textContent = "Sign In";
        }
      } catch (error) {
        alert("Login Error: " + error.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
